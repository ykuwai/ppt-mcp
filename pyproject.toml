[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ppt-mcp"
version = "2.1.0"
description = "Real-time PowerPoint control on Windows and macOS — an MCP server with 156 tools for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ykuwai" },
]
keywords = [
    "mcp",
    "powerpoint",
    "com",
    "applescript",
    "automation",
    "ai-agent",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Both 1.x and 2.x are supported (server.py imports either module layout).
    # The upper bound is deliberate: mcp 2.0 renamed mcp.server.fastmcp with no
    # compatibility shim, which broke every install (#176). Keep new majors
    # opt-in so the same thing cannot happen again.
    "mcp[cli]>=1.0.0,<3.0.0",
    "pydantic>=2.0.0",
    # Tool handlers hand their blocking COM work to anyio.to_thread so the
    # event loop stays free (#198). mcp already pulls anyio in, but this
    # imports it directly, so declare it.
    "anyio>=4.0.0",
    # Platform backends. Windows drives PowerPoint through COM, macOS through
    # Apple Events. Neither is installable on the other platform, so both carry
    # a marker; without one, `uvx ppt-mcp` fails on macOS before the server has
    # a chance to run (#185).
    "pywin32>=306; sys_platform == 'win32'",
    "appscript>=1.4.0; sys_platform == 'darwin'",
    # PowerPoint for Mac has no slide export command, so slide images are
    # rendered from the deck's PDF export with Quartz (#187).
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/ykuwai/ppt-mcp"
Repository = "https://github.com/ykuwai/ppt-mcp"
Issues = "https://github.com/ykuwai/ppt-mcp/issues"

[project.scripts]
ppt-mcp = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
