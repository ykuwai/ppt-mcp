name: Release is tagged

# A release reaches PyPI because a v* tag was pushed, and for no other reason.
# publish.yml listens for that tag and nothing else, so a version bump that
# arrives on main without one is a release that looks finished and was never
# published. That is what happened to v2.0.0: it sat on main for two days
# while PyPI stayed at 1.10.0, and it surfaced by accident while cutting the
# next release.
#
# This runs where someone is already looking, on the pull request that takes a
# release into main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tagged:
    name: The version on main has a tag
    runs-on: ubuntu-latest
    steps:
      # Every tag, and enough history to ask whether one is an ancestor.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The version in pyproject.toml is tagged
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "pyproject.toml says $version"

          if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::No tag v$version. publish.yml only runs on a pushed" \
                 "tag, so this version would reach main without reaching PyPI." \
                 "Tag it on develop first: git tag v$version && git push origin v$version"
            exit 1
          fi
          echo "tag v$version exists"

      # Only on a pull request. A squash merge rewrites the commit, so on main
      # itself the tag never points at anything here and asking would fail
      # every release.
      #
      # The tag has to be the head of this branch, not merely somewhere in its
      # history. Anything pushed after the tag was cut is absent from what
      # publish.yml built, so the release on PyPI would be missing code that
      # main is about to advertise as part of it.
      - name: The tag is the commit being merged
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          tagged=$(git rev-parse "v$version^{commit}")

          if [ "$tagged" != "$HEAD_SHA" ]; then
            echo "::error::Tag v$version points at $tagged, and this branch is at $HEAD_SHA. Whatever came after the tag was not in what was published, so the release would be missing it. Tag the head of this branch and publish that."
            exit 1
          fi
          echo "tag v$version is this branch's head, $tagged"
